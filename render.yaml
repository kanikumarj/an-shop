services:
  - type: web
    name: an-shop-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend

    # prisma is in dependencies (not devDependencies) — npm install installs it
    buildCommand: npm install && npx prisma generate

    startCommand: npx prisma db push --accept-data-loss && node server.js

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: APP_URL
        value: https://an-shop.onrender.com

      - key: FRONTEND_URL
        value: https://anandhshop.vercel.app

      - key: ALLOWED_ORIGINS
        value: https://anandhshop.vercel.app,https://an-shop.onrender.com

      # ─── Secrets: set these in Render Dashboard → Environment ────────────────
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: REDIS_URL
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false
