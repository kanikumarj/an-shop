services:
  - type: web
    name: an-shop-backend
    runtime: node
    region: singapore
    plan: free

    # Build: install deps, generate Prisma client, push schema to NeonDB
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss

    # Start command
    startCommand: node server.js

    # Health check path
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render automatically provides $PORT — no need to set manually
      - key: APP_URL
        value: https://an-shop.onrender.com

      - key: FRONTEND_URL
        value: https://an-shop.onrender.com

      - key: ALLOWED_ORIGINS
        value: https://an-shop.onrender.com

      # ─── Secrets (set in Render Dashboard → Environment) ─────────────
      - key: DATABASE_URL
        sync: false  # postgresql://neondb_owner:...@neon.tech/neondb?sslmode=require

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: REDIS_URL
        sync: false  # Optional — leave blank to run without cache

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false
