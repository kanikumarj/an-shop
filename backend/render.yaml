services:
  - type: web
    name: an-shop-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend

    # Build: install ALL deps (prisma is in dependencies), generate client
    buildCommand: npm install && npx prisma generate

    # Start command
    startCommand: npx prisma db push --accept-data-loss && node server.js

    # Health check
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: APP_URL
        value: https://an-shop.onrender.com

      # Frontend on Vercel — used for CORS and email links
      - key: FRONTEND_URL
        value: https://anandhshop.vercel.app

      # CORS: allow both Vercel frontend and Render itself
      - key: ALLOWED_ORIGINS
        value: https://anandhshop.vercel.app,https://an-shop.onrender.com

      # ─── Secrets (set in Render Dashboard → Environment) ─────────────────────
      - key: DATABASE_URL
        sync: false  # postgresql://neondb_owner:...@neon.tech/neondb?sslmode=require

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: REDIS_URL
        sync: false  # Optional — leave blank to run without Redis cache

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false
